{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Удалить новость</h2>
  <p>Вы уверены, что хотите удалить новость "{{ news.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'news_detail' news.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
